<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search Ria’s Library and download books in your preferred format.">
  <title>Ria’s Library</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./catalog.js" defer></script>
  <script src="./upload.js" defer></script>
</head>
<body data-upload-api="https://rias-library.nutmegarbor1.chatgpt.site">
  <header class="masthead">
    <div class="wrap masthead-inner">
      <div class="welcome">
        <h1>Ria’s <em>Library</em></h1>
        <p>Find your next favorite read and download it in the format you love.</p>
        <a class="browse" href="#catalog">Browse the books</a>
      </div>
      <figure class="hero-art">
        <img src="./reading-nook.png" width="1536" height="1024" alt="Painted reading nook with an open book, flowers, and a heart-shaped cup" fetchpriority="high">
      </figure>
    </div>
  </header>
  <main id="catalog" class="wrap">
    <div class="catalog-heading">
      <h2>Browse the shelves</h2>
      <div class="catalog-actions">
        <button id="open-folder" class="secondary" type="button">Open local folder</button>
        <button id="open-upload" class="secondary upload-button" type="button" hidden>Upload a book</button>
      </div>
      <input id="folder" type="file" webkitdirectory multiple hidden>
    </div>
    <div class="filters" aria-label="Catalog filters">
      <label for="search">Search books
        <input id="search" type="search" placeholder="Search by title or author" autocomplete="off" disabled>
      </label>
      <label for="format">Format
        <select id="format" disabled><option value="">All formats</option></select>
      </label>
    </div>
    <fieldset id="genre-filter" class="genre-filter" hidden>
      <legend>Genres</legend>
      <div id="genres" class="genre-options"></div>
    </fieldset>
    <p id="summary" class="summary" role="status" aria-live="polite">Loading catalog…</p>
    <ul id="books" class="books" aria-label="Books"></ul>
    <nav id="pagination" class="pagination" aria-label="Catalog pages" hidden>
      <button id="previous" class="secondary" type="button">Previous</button>
      <span id="page-number"></span>
      <button id="next" class="secondary" type="button">Next</button>
    </nav>
  </main>
  <dialog id="upload-dialog" class="upload-dialog" aria-labelledby="upload-title">
    <form id="upload-form">
      <div class="upload-heading">
        <h2 id="upload-title">Share a book</h2>
        <button id="close-upload" class="secondary" type="button">Close</button>
      </div>
      <p>Anyone can download your book and see the title, author, and uploader name you enter.</p>
      <label for="upload-file">Book file
        <input id="upload-file" name="file" type="file" accept=".pdf,.epub,application/pdf,application/epub+zip" required>
      </label>
      <p class="field-help">PDF or EPUB, up to 25 MB.</p>
      <label for="book-title">Book title
        <input id="book-title" name="title" type="text" maxlength="140" required>
      </label>
      <label for="book-author">Author
        <input id="book-author" name="author" type="text" maxlength="100" required>
      </label>
      <label for="book-uploader">Uploader display name
        <input id="book-uploader" name="uploader" type="text" maxlength="60" autocomplete="nickname" required>
      </label>
      <p id="upload-status" class="upload-status" role="status" aria-live="polite"></p>
      <button id="publish-upload" class="secondary upload-button" type="submit">Publish book</button>
    </form>
  </dialog>
</body>
</html>
